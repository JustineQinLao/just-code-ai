name: Release

# Push a tag like v0.1.0 to build the extension for Linux and macOS and attach both .vsix files to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest   # node-pty compiles from source here
            asset: just-code-linux-x64.vsix
          - os: macos-latest    # ships node-pty prebuilds for both Apple silicon and Intel
            asset: just-code-mac.vsix
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run compile
      - run: npx --yes @vscode/vsce package --allow-missing-repository --skip-license -o ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
